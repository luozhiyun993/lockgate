# Lockgate 自建配置模板：节点 + 分组 + 规则写在一个文件里。
# 用法：复制一份（不要把带真实节点的文件提交到公开仓库），把 proxies 换成你自己的节点，
#       在「订阅」页点「导入本地配置…」。之后修改文件会自动重新导入。
# 端口、控制接口、DNS、TUN 等由 Lockgate 接管，这里不用写（写了也会被忽略）。
# 分类数据来自 Lockgate 内置的地理数据库，可在「代理 → 外部资源」开启自动更新。

proxies:
  # ← 换成你自己的节点，可以有多个
  - {name: "我的节点", type: ss, server: 192.0.2.1, port: 8388, cipher: aes-128-gcm, password: "change-me"}

proxy-groups:
  # include-all 会自动包含上面全部节点，新增节点不用改这里
  - {name: 节点选择, type: select, include-all: true, proxies: [DIRECT]}
  - {name: AI, type: select, include-all: true, proxies: [节点选择]}
  - {name: 流媒体, type: select, include-all: true, proxies: [节点选择]}
  - {name: Telegram, type: select, include-all: true, proxies: [节点选择]}
  - {name: 开发工具, type: select, proxies: [节点选择, DIRECT]}
  - {name: 微软服务, type: select, proxies: [DIRECT, 节点选择]}
  - {name: 苹果服务, type: select, proxies: [DIRECT, 节点选择]}
  - {name: Apple CDN, type: select, proxies: [DIRECT, 节点选择]}
  - {name: 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  - {name: 国内直连, type: select, proxies: [DIRECT, 节点选择]}
  - {name: 漏网之鱼, type: select, proxies: [节点选择, DIRECT]}

rule-providers:
  # 你自己的规则：写在这里，永远不会被自动更新改动。目标分组在下面 rules 里指定。
  my-direct:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,example-direct.com
  my-proxy:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,example-proxy.com
  my-reject:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,example-blocked.com

rules:
  # 1. 自定义规则，优先级最高
  - RULE-SET,my-reject,REJECT
  - RULE-SET,my-direct,DIRECT
  - RULE-SET,my-proxy,节点选择
  # 2. 本机和局域网
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  # 3. 广告
  - GEOSITE,category-ads-all,广告拦截
  # 4. 按服务分类（越具体的越靠前）
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,apple-cn,Apple CDN
  - GEOSITE,icloud,苹果服务
  - GEOSITE,apple,苹果服务
  - GEOSITE,telegram,Telegram
  - GEOIP,telegram,Telegram,no-resolve
  - GEOSITE,youtube,流媒体
  - GEOSITE,netflix,流媒体
  - GEOIP,netflix,流媒体,no-resolve
  - GEOSITE,disney,流媒体
  - GEOSITE,spotify,流媒体
  - GEOSITE,github,开发工具
  - GEOSITE,category-dev,开发工具
  - GEOSITE,onedrive,微软服务
  - GEOSITE,microsoft,微软服务
  # 5. 国内与国外
  - GEOSITE,cn,国内直连
  - GEOSITE,geolocation-!cn,节点选择
  - GEOIP,cn,国内直连
  # 6. 兜底
  - MATCH,漏网之鱼
